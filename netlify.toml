# Static site, no build step. `dist/` is generated but not required —
# Netlify serves the source directly.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Revalidate code on every request. A returning visitor should never run an
# old main.js against a new index.html — the ETag keeps it cheap.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, no-cache"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, no-cache"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The films, the posters and the Our Work thumbnails. Without this they fall
# back to Netlify's default and revalidate on every visit, so a returning
# visitor re-pulls all 12 MB.
#
# A week, not a year, and deliberately NOT immutable: these filenames carry no
# version, so media/case.mp4 can be replaced by a different film at the same
# path. `immutable` tells a browser never to check again, which would strand
# the old one in people's caches with no way to flush it. A week is long enough
# that nobody re-downloads a film twice in a sitting, and short enough that a
# replacement reaches everyone without a rename.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ── keep the workings off the web ──────────────────────────────────────
# publish = "." serves the whole repository, so every note written for
# ourselves was readable by anyone who guessed the filename: SITE.md alone
# carries the enquiry address, the outstanding list, and the fact that the
# case-study figures are a model.
#
# Named one by one, not globbed. Netlify's `from` does NOT support extension
# patterns — the splat only matches a trailing path remainder, so "/*.md"
# matches nothing and the rules sat there doing nothing through two deploys.
# A short explicit list is verifiable; a clever pattern was not.
#
# ANY NEW DOC OR SCRIPT AT THE ROOT NEEDS A LINE HERE, or it is public.

[[redirects]]
  from = "/SITE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/BRIEF.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
